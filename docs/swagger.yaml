        以下为额外的字段说明: <br>
        level: 默认使用 0, 少部分表达式会使用此字段<br>
        channel: 在不同的场景下此值会不一样, 部分值及其说明如下<br>
        - item_comment: 默认情况下使用此channel<br>
        - check_long_numbers: 需要额外检查文本是否包含长数字时使用此channel<br>
