definitions:
  bunker-web_routers_openapi_user.GetStatusResponseData:
    properties:
      create_at:
        description: 创建时间
        type: integer
      game_id:
        description: 绑定的游戏ID
        type: integer
      is_admin:
        description: 是否为系统管理员
        type: boolean
      username:
        description: 用户名
        type: string
    type: object
  g79.RandomName:
    properties:
      name:
        description: 随机昵称
        type: string
      type:
        description: 昵称类型, 0 表示账号原有昵称
        type: integer
    type: object
  g79.RealmsServerBlocklistPlayer:
    properties:
      create_time:
        description: 加入黑名单时间
        type: integer
      head:
        description: 玩家头像地址
        type: string
      nickname:
        description: 玩家昵称
        type: string
      uid:
        description: 玩家 UID
        type: integer
    type: object
  g79.RealmsServerInviteCode:
    properties:
      code:
        description: 邀请码
        type: string
      id:
        description: 邀请码 ID
        type: string
      permission:
        description: 加入后的权限
        type: string
      share_text:
        description: 分享文案
        type: string
      sid:
        description: 山头服 SID
        type: string
    type: object
  g79.RentalServerBackupInfo:
    properties:
      backup_id:
        description: 备份槽位 ID
        type: integer
      backup_name:
        description: 备份名称
        type: string
      backup_size:
        description: 备份大小
        type: integer
      backup_ts:
        description: 备份时间戳
        type: integer
      is_processing:
        description: 是否正在处理
        type: boolean
    type: object
  g79.RentalServerInfo:
    properties:
      brief_summary:
        type: string
      capacity:
        type: integer
      chainInfo:
        type: string
      entity_id:
        type: string
      has_pwd:
        type: string
      icon_index:
        type: integer
      image_url:
        type: string
      ip_address:
        type: string
      like_num:
        type: integer
      mc_version:
        type: string
      min_level:
        type: string
      name:
        type: string
      offset:
        description: unknown type
      owner_id:
        type: integer
      player_count:
        type: integer
      pvp:
        type: boolean
      server_name:
        type: string
      server_type:
        type: string
      status:
        type: integer
      visibility:
        type: integer
      world_id:
        type: string
    type: object
  giner.BasicResponse:
    properties:
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  helper.GetUserDetailsRequest:
    properties:
      uid:
        description: 目标玩家的启动器UID
        minimum: 1
        type: integer
    type: object
  helper.GetUserDetailsResponse:
    properties:
      data:
        items:
          additionalProperties: {}
          type: object
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  helper.GetUserStateRequest:
    properties:
      uid:
        description: 目标玩家的启动器UID
        minimum: 1
        type: integer
    type: object
  helper.GetUserStateResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  helper.SearchUserRequest:
    properties:
      nickname:
        description: 要查找的玩家昵称
        minLength: 1
        type: string
    type: object
  helper.SearchUserResponse:
    properties:
      data:
        items:
          additionalProperties: {}
          type: object
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  other.RandomNameResponse:
    properties:
      data:
        description: 随机昵称候选列表
        items:
          $ref: '#/definitions/g79.RandomName'
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  other.ReviewResult:
    properties:
      end:
        description: 匹配的敏感词在文本中的结束位置
        type: integer
      group:
        description: 匹配的敏感词规则组, 其中 "nickname" 只在昵称检测时使用
        type: string
      index:
        description: 匹配的敏感词在文本中的起始位置
        type: integer
      start:
        description: 匹配的敏感词在文本中的起始位置
        type: integer
      text:
        description: 匹配的敏感词
        type: string
    type: object
  other.ReviewWordRequest:
    properties:
      channel:
        description: 检测频道, 不填写则使用默认值 item_comment (仅在非昵称检测时使用)
        example: item_comment
        maxLength: 100
        type: string
      content:
        description: 被检测的文本
        minLength: 1
        type: string
      first_only:
        description: 是否只返回第一个匹配的敏感词 (快速匹配), 默认为 false
        example: false
        type: boolean
      level:
        description: 检测级别, 不填写则使用默认值 0 (仅在非昵称检测时使用)
        example: "0"
        maxLength: 100
        type: string
      nickname:
        description: 是否为昵称检测, 默认为 false
        example: false
        type: boolean
    type: object
  other.ReviewWordResponse:
    properties:
      data:
        description: 检测结果, 包含所有匹配的敏感词信息; 未匹配到敏感词此项为空
        items:
          $ref: '#/definitions/other.ReviewResult'
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.ApplicationApproveItem:
    properties:
      application_id:
        description: 申请 ID
        minimum: 1
        type: integer
      permission:
        description: 通过时的成员权限, 不传则使用默认权限
        type: string
    type: object
  realms_server.ApplicationApproveRequest:
    properties:
      action:
        description: 1=通过, 2=拒绝, 3=拉黑并拒绝
        enum:
        - 1
        - 2
        - 3
        type: integer
      items:
        description: 待审批项目, 最多 20 项
        items:
          $ref: '#/definitions/realms_server.ApplicationApproveItem'
        maxItems: 20
        minItems: 1
        type: array
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    required:
    - items
    type: object
  realms_server.ApplicationApproveResponse:
    properties:
      data:
        additionalProperties: {}
        description: 审批结果, 主要字段为 results
        type: object
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.ApplicationQueryRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.ApplicationQueryResponse:
    properties:
      data:
        additionalProperties: {}
        description: 申请队列, 主要字段为 queue
        type: object
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.BlocklistAddRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      uid:
        description: 玩家 UID
        minLength: 1
        type: string
    type: object
  realms_server.BlocklistQueryRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.BlocklistQueryResponse:
    properties:
      data:
        description: 黑名单玩家列表
        items:
          $ref: '#/definitions/g79.RealmsServerBlocklistPlayer'
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.BlocklistRemoveRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      uid:
        description: 玩家 UID
        minLength: 1
        type: string
    type: object
  realms_server.GetOnlinePlayersRequest:
    properties:
      length:
        description: 分页长度, 默认为 9
        example: 9
        maximum: 100
        minimum: 1
        type: integer
      offset:
        description: 分页偏移
        minimum: 0
        type: integer
      order_type:
        description: 排序类型 (0, 1)
        example: 0
        type: integer
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.GetOnlinePlayersResponse:
    properties:
      data:
        description: 在线玩家列表
        items:
          additionalProperties: {}
          type: object
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.InviteCodeGenerateRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.InviteCodeGenerateResponse:
    properties:
      data:
        description: 新生成的邀请码
        type: string
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.InviteCodeQueryRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.InviteCodeQueryResponse:
    properties:
      data:
        description: 邀请码列表
        items:
          $ref: '#/definitions/g79.RealmsServerInviteCode'
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.InviteCodeRemoveRequest:
    properties:
      code:
        description: 邀请码
        minLength: 1
        type: string
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.InviteCodeUpdateRequest:
    properties:
      code:
        description: 邀请码
        minLength: 1
        type: string
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      share_text:
        description: 分享文案, 允许传空字符串
        type: string
    required:
    - share_text
    type: object
  realms_server.MemberInviteQueryRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.MemberInviteQueryResponse:
    properties:
      data:
        description: 待处理邀请列表
        items:
          additionalProperties: {}
          type: object
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.MemberInviteRemoveRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      uid:
        description: 被邀请玩家 UID
        minLength: 1
        type: string
    type: object
  realms_server.MemberInviteRequest:
    properties:
      permission:
        description: 加入后的权限
        enum:
        - "11111111"
        - "11111100"
        - "00000000"
        type: string
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      uid:
        description: 被邀请玩家 UID
        minLength: 1
        type: string
    type: object
  realms_server.MemberInviteUpdateRequest:
    properties:
      permission:
        description: 加入后的权限
        enum:
        - "11111111"
        - "11111100"
        - "00000000"
        type: string
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      uid:
        description: 被邀请玩家 UID
        minLength: 1
        type: string
    type: object
  realms_server.MemberQueryRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.MemberQueryResponse:
    properties:
      data:
        description: 成员列表
        items:
          additionalProperties: {}
          type: object
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.MemberRemoveRequest:
    properties:
      remove_all:
        description: 是否移除全部成员
        type: boolean
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      uid:
        description: 玩家 UID, remove_all=false 时必填
        type: string
    type: object
  realms_server.MemberSetPermissionRequest:
    properties:
      permission:
        description: '权限: 管理员、成员、访客'
        enum:
        - "11111111"
        - "11111100"
        - "00000000"
        type: string
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
      uid:
        description: 玩家 UID
        minLength: 1
        type: string
    type: object
  realms_server.SearchRequest:
    properties:
      server_code:
        description: '游戏内显示的山头码, 需要包含 # 前缀'
        example: '#12345678'
        minLength: 2
        type: string
    type: object
  realms_server.SearchResponse:
    properties:
      data:
        additionalProperties: {}
        description: 山头服详细信息
        type: object
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  realms_server.TurnOffRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  realms_server.TurnOnRequest:
    properties:
      server_id:
        description: 山头服 SID
        minLength: 1
        type: string
    type: object
  rental_server.BanPlayerRequest:
    properties:
      server_id:
        description: 租赁服实体ID
        minLength: 1
        type: string
      status:
        description: 是否为黑名单状态 (0, 1)
        enum:
        - 0
        - 1
        type: integer
      uid:
        description: 目标玩家的启动器UID
        minimum: 1
        type: integer
    type: object
  rental_server.CreateBackupRequest:
    properties:
      backup_name:
        description: 备份名称
        minLength: 1
        type: string
      backup_slot:
        description: 要使用的备份槽位, 范围为1-5
        maximum: 5
        minimum: 1
        type: integer
      server_code:
        description: 服务器号
        minLength: 1
        type: string
    type: object
  rental_server.GetPlayerListRequest:
    properties:
      is_online:
        description: 是否在线 (false, true, null(不限))
        type: boolean
      length:
        description: 查询分页长度 (null(不限))
        example: 50
        type: integer
      offset:
        description: 查询分页偏移
        type: integer
      order_type:
        description: 排序类型 (0, 1)
        example: 0
        type: integer
      server_id:
        description: 租赁服实体ID
        minLength: 1
        type: string
      status:
        description: 玩家状态 (是否黑名单) (0, 1, null(不限))
        type: integer
    type: object
  rental_server.GetPlayerListResponse:
    properties:
      data:
        description: 玩家数据列表
        items:
          additionalProperties: {}
          type: object
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  rental_server.KickPlayerRequest:
    properties:
      server_id:
        description: 租赁服实体ID
        minLength: 1
        type: string
      uid:
        description: 目标玩家的启动器UID
        minimum: 1
        type: integer
    type: object
  rental_server.QueryBackupRequest:
    properties:
      server_code:
        description: 服务器号
        minLength: 1
        type: string
    type: object
  rental_server.QueryBackupResponse:
    properties:
      data:
        description: 服务器备份列表
        items:
          $ref: '#/definitions/g79.RentalServerBackupInfo'
        type: array
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  rental_server.SearchRequest:
    properties:
      server_name:
        description: 要查找的租赁服号
        minLength: 1
        type: string
    type: object
  rental_server.SearchResponse:
    properties:
      data:
        $ref: '#/definitions/g79.RentalServerInfo'
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
  rental_server.SetLevelLimitationRequest:
    properties:
      level:
        description: 要设置的服务器准入等级, 0为关闭, 最高为50(基岩V)
        maximum: 50
        minimum: 0
        type: integer
      server_code:
        description: 服务器号
        minLength: 1
        type: string
    type: object
  rental_server.SetPasswordRequest:
    properties:
      password:
        description: 要设置的服务器密码, 内容为空则代表关闭密码
        type: string
      server_code:
        description: 服务器号
        minLength: 1
        type: string
    type: object
  rental_server.SetVisibilityRequest:
    properties:
      server_code:
        description: 服务器号
        minLength: 1
        type: string
      visibility:
        description: 要设置的公开性, 0为所有人可见, 1为好友可见, 2为私密
        maximum: 2
        minimum: 0
        type: integer
    type: object
  rental_server.TurnOffRequest:
    properties:
      server_code:
        description: 服务器号
        minLength: 1
        type: string
    type: object
  rental_server.TurnOnRequest:
    properties:
      server_code:
        description: 服务器号
        minLength: 1
        type: string
    type: object
  user.GetStatusResponse:
    properties:
      data:
        $ref: '#/definitions/bunker-web_routers_openapi_user.GetStatusResponseData'
      message:
        description: 成功或失败原因
        type: string
      success:
        description: 是否成功
        type: boolean
    type: object
info:
  contact: {}
  description: BunkerWeb OpenAPI document, feel free to contact us if you have any
    questions or suggestions.
  title: BunkerWeb OpenAPI
paths:
  /openapi/helper/get_user_details:
    post:
      consumes:
      - application/json
      description: |-
        通过uid获取玩家详细信息, 需要提供 API key
        注意: 此 API 会尝试进行游戏登录 (Helper)
      parameters:
      - description: 此处需要填写 API Key, 可以从用户菜单获取
        in: header
        name: Authorization
        required: true
        type: string
      - description: 请求时需要在 Body 携带以下查询参数
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/helper.GetUserDetailsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功时返回
          schema:
            $ref: '#/definitions/helper.GetUserDetailsResponse'
      summary: 获取玩家详细信息
      tags:
      - 玩家
  /openapi/helper/get_user_state:
    post:
      consumes:
      - application/json
      description: |-
        通过uid获取玩家状态信息, 例如主页点击数量, 需要提供 API key
        注意: 此 API 会尝试进行游戏登录 (Helper)
      parameters:
      - description: 此处需要填写 API Key, 可以从用户菜单获取
        in: header
        name: Authorization
        required: true
        type: string
      - description: 请求时需要在 Body 携带以下查询参数
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/helper.GetUserStateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功时返回
          schema:
            $ref: '#/definitions/helper.GetUserStateResponse'
      summary: 获取玩家状态信息
      tags:
      - 玩家
  /openapi/helper/random_name:
    post:
      description: |-
        获取游戏生成的随机昵称候选列表, 需要提供 API Key 并创建辅助用户
        注意: 此 API 会尝试进行游戏登录 (Helper)
      parameters:
      - description: 此处需要填写 API Key, 可以从用户菜单获取
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功时返回
          schema:
            $ref: '#/definitions/other.RandomNameResponse'
      summary: 获取随机昵称
      tags:
      - 其他
  /openapi/helper/rental_server/get_player_list:
    post:
      consumes:
      - application/json
      description: |-
        获取租赁服玩家列表, 例如历史进入列表, 需要提供 API key
        注意: 此 API 会尝试进行游戏登录 (Helper)
      parameters:
      - description: 此处需要填写 API Key, 可以从用户菜单获取
        in: header
        name: Authorization
        required: true
        type: string
      - description: 请求时需要在 Body 携带以下查询参数
        in: body
        name: Request
        required: true
        schema:
          $ref: '#/definitions/rental_server.GetPlayerListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功时返回
          schema:
            $ref: '#/definitions/rental_server.GetPlayerListResponse'
      summary: 获取租赁服玩家列表
      tags:
      - 租赁服
  /openapi/helper/rental_server/search:
    post:
